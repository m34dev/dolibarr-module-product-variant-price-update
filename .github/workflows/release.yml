name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package module
        run: |
          echo "Packaging productvariantpriceupdate module ..."
          cp LICENSE.md productvariantpriceupdate/LICENSE.md
          cp README.md productvariantpriceupdate/README.md
          cp CHANGELOG.md productvariantpriceupdate/ChangeLog.md
          zip -r "module_productvariantpriceupdate-${{ github.ref_name }}.zip" productvariantpriceupdate/
          echo "productvariantpriceupdate module packaged."

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: Release created from CI/CD
          files: module_productvariantpriceupdate-${{ github.ref_name }}.zip
